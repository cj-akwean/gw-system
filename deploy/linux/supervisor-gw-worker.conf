; GW-System queue worker — Supervisor configuration (production host, Linux).
;
; Reference artifact for the Infra phase — NOT active on any host yet. The dev
; equivalent on this machine is the Windows Scheduled Task (deploy/windows/).
; The flags mirror deploy/windows/queue-worker.ps1: the worker self-exits after
; 8h (--max-time) to shed memory and stale config, and Supervisor's autorestart
; brings up a fresh process. deploy, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
[program:gw-system-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gw-system/backend/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=28800
directory=/var/www/gw-system/backend
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/gw-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=1800
