; GW-System queue worker — Supervisor configuration (production host, Linux).
;
; Reference artifact for the Infra phase — NOT active on any host yet. On dev the
; worker is run manually in a terminal (php artisan queue:work --tries=3); an
; auto-start Windows Scheduled Task was tried and removed 2026-08-07 (it pegged the
; dev machine's disk at 100% at boot), so nothing in this repo auto-starts a worker
; except this file on a production host.
;
; The worker self-exits after 8h (--max-time) to shed memory and stale config, and
; Supervisor's autorestart brings up a fresh process. Logs are rotated here
; (maxbytes 10MB x 5 backups) so worker output can never fill the disk. deploy, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
[program:gw-system-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gw-system/backend/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=28800
directory=/var/www/gw-system/backend
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/gw-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=1800
